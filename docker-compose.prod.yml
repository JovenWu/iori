# Production compose — no bind mounts, no dev servers, no --reload, no
# published Postgres port, non-root containers.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires backend/.env (see backend/.env.example) with ENVIRONMENT=production,
# a strong SECRET_KEY, and non-default credentials — the backend refuses to
# boot otherwise.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: iori-db
    restart: unless-stopped
    # Same credentials source as dev — backend/.env carries POSTGRES_*;
    # Postgres fails loudly at boot if POSTGRES_PASSWORD is absent.
    env_file: ./backend/.env
    # No published port — Postgres stays on the internal network only.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: iori-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin API: empty string → browser calls /api/* on this server,
        # rewrites() proxies to the internal backend (never host-published).
        NEXT_PUBLIC_API_URL: ""
        API_INTERNAL_URL: http://backend:8000
    container_name: iori-frontend
    restart: unless-stopped
    # Loopback only — public exposure goes through the reverse proxy.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3300}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    external: true
    name: iori_pgdata
