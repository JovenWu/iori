services:
  db:
    image: pgvector/pgvector:pg16
    container_name: iori-db
    restart: unless-stopped
    # Credentials come from backend/.env so db and backend can't drift —
    # compose ${VAR} interpolation only sees the project-root .env. Postgres
    # hard-requires POSTGRES_PASSWORD there; USER/DB fall back to the image's
    # own defaults if unset.
    env_file: ./backend/.env
    # Localhost-only by default — nothing outside this machine should reach
    # Postgres. Set POSTGRES_BIND=0.0.0.0 explicitly if a LAN peer needs it.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: iori-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Same .env stays host-compatible — containers reach Postgres by name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: iori-frontend
    restart: unless-stopped
    # Turbopack's watcher misses edits through Docker Desktop's mount layer;
    # webpack + watchpack polling (stat-based, no fs events needed) is the
    # reliable dev path in Docker.
    command: npm run dev -- --webpack
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Image-built deps and the build dir stay container-side — host
      # node_modules/.next carry Windows paths and must never leak in.
      - /app/node_modules
      - /app/.next
    # Dependency changes need an image rebuild: up -d --build frontend.
    depends_on:
      - backend

volumes:
  pgdata:
    external: true
    name: backend_pgdata
