services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sectors-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sectors_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: sectors-agent-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Same .env stays host-compatible — containers reach Postgres by name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sectors-agent-frontend
    restart: unless-stopped
    # Turbopack's watcher misses edits through Docker Desktop's mount layer;
    # webpack + watchpack polling (stat-based, no fs events needed) is the
    # reliable dev path in Docker.
    command: npm run dev -- --webpack
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Image-built deps and the build dir stay container-side — host
      # node_modules/.next carry Windows paths and must never leak in.
      - /app/node_modules
      - /app/.next
    # Dependency changes need an image rebuild: up -d --build frontend.
    depends_on:
      - backend

volumes:
  pgdata:
    external: true
    name: backend_pgdata
